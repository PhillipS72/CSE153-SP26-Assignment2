model:
  name: musicgen
  size: small
dataset:
  path: ../data/audio
  sample_rate: 32000
  sources:
  - dropbox
  - flat
  augmentations: []
  conditions: default
  default_desc: Melody at Train Station
training:
  device: cuda
  batch_size: 8
  num_workers: 4
  optimizer: AdamW
  lr: 1.0e-05
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  num_epochs: 4
