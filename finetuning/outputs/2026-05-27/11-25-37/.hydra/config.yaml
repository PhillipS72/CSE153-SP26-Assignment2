name: musicgen_medium_null_unconditional_augmentations
model:
  name: musicgen
  size: medium
  path: ../models/
dataset:
  path: ../data/audio
  sample_rate: 32000
  sources:
  - dropbox
  - flat
  augmentations:
  - background_noise
  - pitch_shift
  - speed_up
  conditions: default
  default_desc: ''
training:
  device: cuda
  batch_size: 2
  num_workers: 4
  optimizer: AdamW
  lr: 0.0001
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.01
  num_epochs: 5
inference:
  path: ../samples
  num_samples: 10
  durations:
  - 10
