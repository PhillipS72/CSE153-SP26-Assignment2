name: musicgen_medium_conditional

model:
  name: musicgen
  size: medium
  path: ../models/

dataset:
  path: ../data/audio
  sample_rate: 32000
  sources: [dropbox, flat]
  augmentations: []

  conditions: description
  description: ../data/descriptions
  inference: ../data/inferences

training:
  device: cuda
  batch_size: 2
  num_workers: 4

  optimizer: AdamW
  lr: 1e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01

  num_epochs: 5

inference:
  path: ../samples
  num_samples: 10
  durations: [10]
