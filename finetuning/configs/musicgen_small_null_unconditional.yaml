name: musicgen_small_null_unconditional

model:
  name: musicgen
  size: small
  path: ../models/

dataset:
  path: ../data/audio
  sample_rate: 32000
  sources: [dropbox, flat]
  augmentations: []

  conditions: default
  default_desc: ""

training:
  device: cuda
  batch_size: 4
  num_workers: 4

  optimizer: AdamW
  lr: 1e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01

  num_epochs: 10

inference:
  path: ../samples
  num_samples: 5
  durations: [5, 10, 15, 20, 25]
